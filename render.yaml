services:
  - type: web
    name: budgetai
    runtime: node
    plan: starter
    buildCommand: "npm install --prefix client && npm run build --prefix client && npm install --prefix server"
    startCommand: "node server/src/index.js"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: NODE_ENV
        value: production
    disk:
      name: budgetai-data
      mountPath: /var/data
      sizeGB: 1
