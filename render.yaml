services:
  - type: web
    name: budgetai
    runtime: node
    plan: free
    buildCommand: "npm install --prefix client && npm run build --prefix client && npm install --prefix server"
    startCommand: "node server/src/index.js"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
